name: FloatClock
options:
  bundleIdPrefix: com.floatclock
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.1.10"
    CURRENT_PROJECT_VERSION: "20"
    DEVELOPMENT_TEAM: "5UDY685QHH"
    CODE_SIGN_STYLE: Automatic
targets:
  FloatClock:
    type: application
    platform: iOS
    sources:
      - FloatClock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rabbitai-lab.floatclock
        # 仅 iPhone：竖屏锁定 + 现有图标集；iPad 通用版需补 167px 图标与适配
        TARGETED_DEVICE_FAMILY: "1"
        # 图标走资产目录（单尺寸 1024 自动派生）：iOS 11+ SDK 上架硬性要求 CFBundleIconName，
        # 散图 CFBundleIcons 方案会被 ITMS-90713/90022 拒收
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 本机只有 iOS 18.3 模拟器运行时，actool 的 thinned 变体（ODR 触发）会因运行时/SDK
        # 版本不匹配失败；App 无 ODR 需求，关闭以跳过该步（云端不受影响）
        ENABLE_ON_DEMAND_RESOURCES: NO
    info:
      path: FloatClock/Info.plist
      properties:
        CFBundleDisplayName: 兔时笺
        CFBundleLocalizations: [zh-Hans, en, zh-Hant, ja, ko, es, pt-BR, fr, de, it, ru, ar]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 竖屏锁定时钟应用：声明全屏必需，App Store 校验即接受仅竖屏（免"All orientations"警告）
        UIRequiresFullScreen: true
        # PiP 悬浮保活：后台音频（画中画在音频后台模式下才可持续运行）
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
schemes:
  FloatClock:
    build:
      targets:
        FloatClock: all
    run:
      config: Debug
